<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карточка образца</title>
  <style>
    body {
      max-width: 960px;
      margin: 32px auto;
      padding: 0 20px 40px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #1d2329;
    }

    h1, h2 {
      color: #17365d;
    }

    .panel {
      background: #fff;
      border: 1px solid #d9e2ec;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 10px 16px;
    }

    .label {
      font-weight: bold;
      color: #445;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 16px 0 20px;
    }

    button {
      padding: 10px 14px;
      border: 1px solid #b8c7d9;
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
    }

    .updates-item {
      padding: 12px 0;
      border-bottom: 1px solid #e3e8ef;
    }
  </style>
</head>
<body>
  <h1 id="pageTitle">Карточка образца</h1>

  <div class="toolbar">
    <button id="loadSampleBtn">Загрузить данные</button>
    <button id="openKetcherBtn">Открыть рисовалку</button>
    <button id="saveSampleBtn">Сохранить изменения</button>
  </div>

  <section class="panel">
    <h2>Основные данные</h2>
    <div class="grid">
      <div class="label">Sample ID</div><div id="sampleId">—</div>
      <div class="label">Short name</div><div id="shortName">—</div>
      <div class="label">Full name</div><div id="fullName">—</div>
      <div class="label">Formula</div><div id="formula">—</div>
      <div class="label">Current mass (mg)</div><div id="mass">—</div>
      <div class="label">Responsible person</div><div id="responsible">—</div>
    </div>
  </section>

  <section class="panel">
    <h2>Структура</h2>
    <img id="structureImage" src="../Images/structures/TEST-001_structure.png" alt="Структура образца" style="max-width: 320px;">
    <pre id="structureData">Структурные данные пока не загружены.</pre>
  </section>

  <section class="panel">
    <h2>История обновлений</h2>
    <div id="updatesList">Нет данных.</div>
  </section>

  <script src="../scripts/config.js"></script>
  <script src="../scripts/drive-api.js"></script>
  <script src="../scripts/sample-card.js"></script>
</body>
</html>
