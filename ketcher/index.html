<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#000000"/><meta name="description" content="Ketcher is a web-based chemical structure editor"/><link rel="shortcut icon" type="image/x-icon" href="./favicon.ico"/><link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png"/><link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png"/><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png"/><link rel="manifest" href="./manifest.json"/><title>Ketcher v3.18.0</title><script defer="defer" src="./static/js/main.e47c48ad.js"></script><link href="./static/css/main.96b87be0.css" rel="stylesheet"></head><!-- REELUM bridge v3 (чёткий PNG): вставить в index.html Ketcher на GitHub прямо перед </body> -->
<script>
(function () {
  function allowed(origin) {
    try { return /\.googleusercontent\.com$/.test(new URL(origin).hostname); } catch (e) { return false; }
  }
  function blobToDataUrl(blob) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }
  // PNG высокого разрешения: SVG из Ketcher рисуется на холсте с увеличением x4
  async function hiResPng(k, mol) {
    try {
      var svgText = await (await k.generateImage(mol, { outputFormat: 'svg' })).text();
      var w = 0, h = 0;
      var vb = svgText.match(/viewBox=["']\s*[-\d.]+[\s,]+[-\d.]+[\s,]+([\d.]+)[\s,]+([\d.]+)/);
      var wm = svgText.match(/<svg[^>]*\swidth=["']([\d.]+)/);
      var hm = svgText.match(/<svg[^>]*\sheight=["']([\d.]+)/);
      if (wm && hm) { w = parseFloat(wm[1]); h = parseFloat(hm[1]); }
      else if (vb) { w = parseFloat(vb[1]); h = parseFloat(vb[2]); }
      if (!w || !h) { w = 600; h = 400; }
      var img = new Image();
      await new Promise(function (res, rej) {
        img.onload = res; img.onerror = rej;
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgText);
      });
      var scale = Math.min(4, 2400 / Math.max(w, h));
      var c = document.createElement('canvas');
      c.width = Math.round(w * scale); c.height = Math.round(h * scale);
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL('image/png');
    } catch (e) {
      return blobToDataUrl(await k.generateImage(mol, { outputFormat: 'png' }));
    }
  }
  window.addEventListener('message', async function (e) {
    if (!e.data || !e.data.type || !allowed(e.origin)) return;
    var reply = function (msg) { e.source.postMessage(msg, e.origin); };
    var k = window.ketcher;
    if (!k) { reply({ type: 'REELUM_ERROR', error: 'Ketcher ещё загружается, подождите пару секунд' }); return; }
    try {
      if (e.data.type === 'REELUM_EXPORT') {
        var mol = await k.getMolfile();
        var smiles = '';
        try { smiles = await k.getSmiles(); } catch (x) {}
        var cdxml = '';
        try { if (k.getCDXml) cdxml = await k.getCDXml(); } catch (x) {}
        var cdx = '';
        try { if (k.getCDX) cdx = await k.getCDX(); } catch (x) {}
        var png = '';
        if (smiles) png = await hiResPng(k, mol);
        reply({ type: 'REELUM_EXPORT_RESULT', mol: mol, smiles: smiles, cdxml: cdxml, cdx: cdx, png: png });
      } else if (e.data.type === 'REELUM_LOAD') {
        await k.setMolecule(e.data.mol || '');
        reply({ type: 'REELUM_LOADED' });
      }
    } catch (err) {
      reply({ type: 'REELUM_ERROR', error: String((err && err.message) || err) });
    }
  });
})();
</script>

<script>
(function () {
  let rdkitPromise = null;
  let busy = false;
  function loadRDKit() {
    if (rdkitPromise) return rdkitPromise;
    const base = new URL('./rdkit/', window.location.href).href;
    rdkitPromise = new Promise(function (resolve, reject) {
      const script = document.createElement('script');
      script.src = base + 'RDKit_minimal.js';
      script.onerror = function () { reject(new Error('Не загружен rdkit/RDKit_minimal.js')); };
      script.onload = function () {
        if (typeof window.initRDKitModule !== 'function') {
          reject(new Error('Не найдена initRDKitModule')); return;
        }
        window.initRDKitModule({locateFile: function (file) {return base + file;}})
          .then(resolve).catch(reject);
      };
      document.head.appendChild(script);
    }).catch(function (err) {rdkitPromise = null; throw err;});
    return rdkitPromise;
  }
  window.addEventListener('message', async function (e) {
    if (e.source !== window.parent || !e.data || e.data.type !== 'REELUM_FRAGMENT_SEARCH') return;
    try {
      if (!/\.googleusercontent\.com$/.test(new URL(e.origin).hostname)) return;
    } catch (_) {return;}
    const requestId = e.data.requestId;
    const reply = function (message) {
      e.source.postMessage(Object.assign({requestId: requestId}, message), e.origin);
    };
    if (busy) {
      reply({type: 'REELUM_FRAGMENT_ERROR', error: 'Предыдущий поиск ещё выполняется.'}); return;
    }
    busy = true;
    let query = null;
    try {
      if (!window.ketcher) throw new Error('Ketcher ещё не загрузился.');
      const molfile = await window.ketcher.getMolfile();
      const rdkit = await loadRDKit();
      query = rdkit.get_mol(molfile);
      if (!query || !query.is_valid() || query.get_num_atoms() === 0) {
        throw new Error('Нарисуйте обычный молекулярный фрагмент с атомами и связями.');
      }
      const items = Array.isArray(e.data.items) ? e.data.items : [];
      const sampleIds = []; const invalidIds = []; let checked = 0;
      for (let i = 0; i < items.length; i++) {
        let target = null;
        try {
          target = rdkit.get_mol(String(items[i].smiles || ''));
          if (!target || !target.is_valid() || !target.get_num_atoms()) throw new Error('Invalid target');
          const match = JSON.parse(target.get_substruct_match(query));
          checked++;
          if (Array.isArray(match.atoms) && match.atoms.length) sampleIds.push(items[i].sampleId);
        } catch (_) {invalidIds.push(items[i].sampleId);}
        finally {if (target) target.delete();}
        if ((i + 1) % 20 === 0) {
          reply({type: 'REELUM_FRAGMENT_PROGRESS', checked: checked});
          await new Promise(resolve => setTimeout(resolve, 0));
        }
      }
      reply({type: 'REELUM_FRAGMENT_RESULT', sampleIds: sampleIds, invalidIds: invalidIds, checked: checked});
    } catch (err) {
      reply({type: 'REELUM_FRAGMENT_ERROR', error: err.message || String(err)});
    } finally {
      if (query) query.delete();
      busy = false;
    }
  });
})();
</script>
